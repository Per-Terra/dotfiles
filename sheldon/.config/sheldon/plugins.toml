# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the config file:
#
# - `sheldon add` to add a new plugin to the config file
# - `sheldon edit` to open up the config file in the default editor
# - `sheldon remove` to remove a plugin from the config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"
apply = ["defer"]

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins]

[plugins.zsh-defer]
github = "romkatv/zsh-defer"
apply = ["source"]

[plugins.starship]
inline = 'builtin source <(starship init zsh)'

[plugins.fzf]
inline = '''
autoload -Uz is-at-least
if is-at-least 0.48 "$(fzf --version 2>/dev/null | cut -d' ' -f1)"; then
  builtin source <(fzf --zsh)
else
  # apt-packaged fzf (<0.48) ships shell integration as files
  builtin source /usr/share/doc/fzf/examples/key-bindings.zsh
  builtin source /usr/share/doc/fzf/examples/completion.zsh
fi
'''

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

[plugins.local]
local = "~/.config/zsh"
use = ["*.zsh", "!deferred.zsh"]
apply = ["source"]

# compinit を実行するため fzf-tab より先にロードする
[plugins.local-deferred]
local = "~/.config/zsh"
use = ["deferred.zsh"]

# fzf-tab は compinit の後、widget をラップするプラグインより前にロードする
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"

# osascript/terminal-notifier を使うため macOS のみロードする
[plugins.notify]
github = "stepan-tikunov/zsh-notify"
branch = "macos-terminals"
hooks.pre = "if [[ $OSTYPE == darwin* ]]; then"
hooks.post = "fi"
